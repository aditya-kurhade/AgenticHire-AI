version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: agentichire-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=agentichire

  qdrant:
    image: qdrant/qdrant:latest
    container_name: agentichire-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  mongodb_data:
  qdrant_data:
